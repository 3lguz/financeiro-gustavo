async function syncArray(table,newArr,oldArr,toDB){
  const oldMap=new Map(oldArr.map(x=>[x.id,x]));
  const newMap=new Map(newArr.map(x=>[x.id,x]));
  const toUpsert=[];
  for(const item of newArr){const prev=oldMap.get(item.id);if(!prev||JSON.stringify(prev)!==JSON.stringify(item))toUpsert.push(toDB(item));}
  const toDelete=[];
  for(const item of oldArr)if(!newMap.has(item.id))toDelete.push(item.id);
  if(toUpsert.length){const{error}=await sb.from(table).upsert(toUpsert);if(error)console.error("upsert",table,error);}
  if(toDelete.length){const{error}=await sb.from(table).delete().in("id",toDelete);if(error)console.error("delete",table,error);}
}

const genInstallments=(total,n,firstDate)=>{
  const per=Math.round(total/n*100)/100;
  return Array.from({length:n},(_,i)=>{
    const d=new Date(firstDate+"T12:00");d.setMonth(d.getMonth()+i);
    const v=i===n-1?Math.round((total-per*(n-1))*100)/100:per;
    return{id:uid(),num:i+1,value:v,dueDate:d.toISOString().slice(0,10),status:"pending"};
  });
};
const projInterest=(principal,rate,days)=>{
  if(rate<=0||days<=0)return{total:principal,interest:0,projected:[]};
  let bal=principal;const proj=[];
  for(let d=1;d<=days;d++){bal+=bal*rate/100;if(d%7===0||d===days)proj.push({day:d,balance:Math.round(bal*100)/100,interest:Math.round((bal-principal)*100)/100});}
  return{total:Math.round(bal*100)/100,interest:Math.round((bal-principal)*100)/100,projected:proj};
};

  eye:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,

function LoginScreen({onLogin}){

  return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
      <div style={{marginBottom:32,textAlign:"center"}}>
        <div style={{width:56,height:56,borderRadius:14,background:C.red,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}}>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>

        <div style={{textAlign:"center",color:C.tx2,fontSize:13,fontWeight:500,marginBottom:20}}>Entre com seu email e senha</div>
        <Field label="Email"><input type="email" value={email} autoComplete="email" onChange={e=>setEmail(e.target.value)} style={inp} placeholder="seu@email.com" onFocus={e=>e.target.style.borderColor=C.blu} onBlur={e=>e.target.style.borderColor=C.bg5}/></Field>
        <div style={{height:12}}/>
        <Field label="Senha"><input type="password" value={password} autoComplete="current-password" onChange={e=>setPassword(e.target.value)} style={inp} placeholder="••••••••" onFocus={e=>e.target.style.borderColor=C.blu} onBlur={e=>e.target.style.borderColor=C.bg5}/></Field>
        {error&&<div style={{marginTop:14,padding:"10px 12px",background:`${C.red}15`,border:`1px solid ${C.red}40`,borderRadius:8,color:C.red,fontSize:12,fontWeight:500}}>{error}</div>}
        <div style={{height:18}}/><Btn variant="blue" onClick={submit} full>{loading?"Entrando...":"Entrar"}</Btn>
        <div style={{marginTop:16,fontSize:11,color:C.tx3,textAlign:"center",lineHeight:1.5}}>Novos usuários são criados pelo administrador<br/>no painel do Supabase.</div>
      </form>
    </div>
  );
}

// ════════════════════════════════════════════════════════
//  CONTAS A PAGAR TAB (NEW)
// ════════════════════════════════════════════════════════
function ContasAPagarTab({exps,enrichDebs,accounts,C,fmt,fmtD,tod,daysU,Badge,Btn,Card,Kpi,TR,Field,setTab,agenda,addAgendaItem,removeAgendaItem,payAgendaItem}){
  const today=tod();
  const now=new Date();
  const curMonth=now.getMonth();
  const curYear=now.getFullYear();
  const p2=n=>String(n).padStart(2,"0");
  const[agForm,setAgForm]=useState({date:"",amount:"",description:"",category:"estoque",account:"cofre"});

  // Check which fixed bills have been paid this month
  const fixedBillsStatus=useMemo(()=>{
    return CONTAS_FIXAS.map(cf=>{
      const ym=`${curYear}-${p2(curMonth+1)}`;
      const paid=exps.filter(e=>getYM(e.date)===ym&&e.category===cf.category);
      const totalPaid=paid.reduce((s,e)=>s+e.amount,0);
      const lastPaid=paid.length>0?paid.sort((a,b)=>b.date.localeCompare(a.date))[0]:null;
      // Estimate from last 3 months
      const estimates=[];
      for(let i=1;i<=3;i++){
        const mo=curMonth-i;const yr=mo<0?curYear-1:curYear;const m=((mo%12)+12)%12;
        const ym2=`${yr}-${p2(m+1)}`;
        const found=exps.filter(e=>getYM(e.date)===ym2&&e.category===cf.category);
        if(found.length>0)estimates.push(found.reduce((s,e)=>s+e.amount,0));
      }
      const avgEstimate=estimates.length>0?estimates.reduce((s,v)=>s+v,0)/estimates.length:0;
      const dueDate=`${curYear}-${p2(curMonth+1)}-${p2(cf.typicalDay)}`;
      const daysUntil=daysU(dueDate);
      return{...cf,paid:totalPaid>0,totalPaid,lastPaid,avgEstimate,dueDate,daysUntil,isPastDue:daysUntil<0&&totalPaid===0};
    });
  },[exps,curMonth,curYear]);

  const unpaidFixed=fixedBillsStatus.filter(b=>!b.paid);
  const paidFixed=fixedBillsStatus.filter(b=>b.paid);
  const totalFixedEstimate=fixedBillsStatus.reduce((s,b)=>s+(b.paid?b.totalPaid:b.avgEstimate),0);
  const totalUnpaid=unpaidFixed.reduce((s,b)=>s+b.avgEstimate,0);

  // Upcoming debt payments (installments + debts)
  const upcomingPayments=useMemo(()=>{
    const items=[];
    enrichDebs.forEach(d=>{
      if(d.status==="paid")return;
      const inst=(d.installments||[]).filter(i=>i.status==="pending");
      if(inst.length>0){
        inst.forEach(i=>{
          const due=daysU(i.dueDate);
          if(due<=30)items.push({id:i.id,label:`${d.creditor} — Parcela ${i.num}`,amount:i.value,dueDate:i.dueDate,due,type:d.type,priority:d.priority||DTP[d.type]||3});
        });
      }else{
        const due=daysU(d.dueDate);
        if(due<=30)items.push({id:d.id,label:d.creditor,amount:d.remaining||d.value,dueDate:d.dueDate,due,type:d.type,priority:d.priority||DTP[d.type]||3});
      }
    });
    return items.sort((a,b)=>a.due-b.due);
  },[enrichDebs]);

  // Calendar view - next 30 days
  const calendarDays=useMemo(()=>{
    const days=[];
    for(let i=0;i<30;i++){
      const d=new Date();d.setDate(d.getDate()+i);
      const ds=d.toISOString().slice(0,10);
      const dayNum=d.getDate();const dow=d.getDay();
      const fixedDue=fixedBillsStatus.filter(b=>!b.paid&&b.dueDate===ds);
      const debtDue=upcomingPayments.filter(p=>p.dueDate===ds);
      const totalDue=fixedDue.reduce((s,b)=>s+b.avgEstimate,0)+debtDue.reduce((s,p)=>s+p.amount,0);
      days.push({date:ds,dayNum,dow,isToday:i===0,fixedDue,debtDue,totalDue,isSunday:dow===0});
    }
    return days;
  },[fixedBillsStatus,upcomingPayments]);

  return(<>
    {/* Guide banner */}
    <div style={{background:`${C.blu}0c`,border:`1px solid ${C.blu}28`,borderRadius:12,padding:"14px 18px",marginBottom:14,fontSize:13,lineHeight:1.8}}>
      <strong style={{color:C.blu}}>Como funciona:</strong> Esta tela mostra todas as <strong>contas fixas do mês</strong> (folha, aluguel, energia, etc.) e os <strong>vencimentos de dívidas</strong>. Quando você lançar a despesa na aba "Despesas", ela será marcada como paga automaticamente aqui. As estimativas são baseadas na média dos últimos 3 meses.
    </div>

    {/* KPIs */}
    <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"}}>
      <Kpi v={fmt(totalFixedEstimate)} l="Total Fixo do Mês (estimado)" color={C.org}/>
      <Kpi v={fmt(totalUnpaid)} l="Falta Pagar (fixas)" color={unpaidFixed.length>0?C.red:C.grn}/>
      <Kpi v={`${paidFixed.length}/${fixedBillsStatus.length}`} l="Contas Fixas Pagas" color={paidFixed.length===fixedBillsStatus.length?C.grn:C.org}/>
      <Kpi v={`${upcomingPayments.length}`} l="Dívidas Vencem em 30d" color={upcomingPayments.length>0?C.red:C.grn}/>
    </div>

    {/* Fixed Bills Checklist */}
    <Card title={`Contas Fixas — ${MESES[curMonth]}/${curYear}`} action={`${paidFixed.length}/${fixedBillsStatus.length} pagas`}>
      {fixedBillsStatus.map(b=>(
        <div key={b.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${C.bg5}`}}>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <div style={{width:28,height:28,borderRadius:8,background:b.paid?`${C.grn}20`:`${C.bg4}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>
              {b.paid?"✅":b.icon}
            </div>
            <div>
              <div style={{fontSize:13,fontWeight:500,color:b.paid?C.tx3:C.tx,textDecoration:b.paid?"line-through":"none"}}>{b.label}</div>
              <div style={{fontSize:11,color:C.tx3}}>
                Vence dia {b.typicalDay} · {b.paid?`Pago ${fmtD(b.lastPaid?.date)}`:(b.isPastDue?<span style={{color:C.red,fontWeight:600}}>ATRASADO {Math.abs(b.daysUntil)}d</span>:b.daysUntil===0?<span style={{color:C.org,fontWeight:600}}>VENCE HOJE</span>:`Vence em ${b.daysUntil}d`)}
              </div>
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            {b.paid?<div style={{color:C.grn,fontWeight:700,fontSize:14}}>{fmt(b.totalPaid)}</div>:<div style={{color:C.org,fontWeight:600,fontSize:14}}>~{fmt(b.avgEstimate)}</div>}
            {!b.paid&&b.avgEstimate>0&&<div style={{fontSize:10,color:C.tx3}}>estimativa</div>}
            {!b.paid&&<Btn variant="warn" onClick={()=>setTab("despesas")} style={{padding:"3px 8px",fontSize:10,marginTop:4}}>Lançar →</Btn>}
          </div>
        </div>
      ))}
      <div style={{marginTop:10,display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:600}}>
        <span style={{color:C.tx2}}>Total Fixo Estimado</span>
        <span style={{color:C.org}}>{fmt(totalFixedEstimate)}</span>
      </div>
    </Card>

    {/* Calendar View */}
    <Card title="Calendário de Vencimentos — Próximos 30 Dias">
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:8}}>
        {["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(d=><div key={d} style={{textAlign:"center",fontSize:10,color:C.tx3,fontWeight:600,padding:"4px 0"}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        {/* Padding for first week alignment */}
        {Array.from({length:calendarDays[0]?.dow||0}).map((_,i)=><div key={`pad${i}`}/>)}
        {calendarDays.map(day=>{
          const hasItems=day.totalDue>0;
          const bg=day.isToday?`${C.blu}25`:hasItems?`${C.red}12`:C.bg3;
          const border=day.isToday?`${C.blu}60`:hasItems?`${C.red}30`:C.bg5;
          return<div key={day.date} title={hasItems?`${fmtD(day.date)}: ${fmt(day.totalDue)} a pagar`:fmtD(day.date)} style={{aspectRatio:"1",borderRadius:6,background:bg,border:`1px solid ${border}`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:hasItems?"default":"default",minHeight:38}}>
            <div style={{fontSize:11,fontWeight:day.isToday?700:400,color:day.isSunday?C.red:day.isToday?C.blu:C.tx2}}>{day.dayNum}</div>
            {hasItems&&<div style={{fontSize:7,color:C.red,fontWeight:700,marginTop:1}}>{fmt(day.totalDue).replace("R$","R$")}</div>}
            {day.fixedDue.length>0&&<div style={{width:4,height:4,borderRadius:"50%",background:C.org,marginTop:1}}/>}
          </div>;
        })}
      </div>
      <div style={{display:"flex",gap:14,marginTop:10,fontSize:11,color:C.tx3}}>
        <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,borderRadius:"50%",background:C.org,display:"inline-block"}}/>Conta fixa</span>
        <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,borderRadius:2,background:`${C.red}40`,display:"inline-block"}}/>Dívida/Parcela</span>
        <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,borderRadius:2,background:`${C.blu}40`,display:"inline-block"}}/>Hoje</span>
      </div>
    </Card>

    {/* Upcoming Debt Payments */}
    <Card title="Próximos Vencimentos de Dívidas" action={`${upcomingPayments.length} itens`}>
      {upcomingPayments.length===0?<div style={{color:C.tx3,fontSize:13,textAlign:"center",padding:"14px"}}>Nenhum vencimento de dívida nos próximos 30 dias.</div>:
      upcomingPayments.map(p=>{
        const pc=PC[p.priority]||PC[3];
        return<div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.bg5}`}}>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <span style={{width:6,height:6,borderRadius:"50%",background:pc.color,flexShrink:0,display:"inline-block"}}/>
            <div>
              <div style={{fontSize:12,color:C.tx2}}>{p.label.slice(0,35)}</div>
              <div style={{fontSize:11,color:C.tx3}}>
                {fmtD(p.dueDate)} · <Badge text={p.due<0?`${Math.abs(p.due)}d atraso`:p.due===0?"Hoje":`${p.due}d`} color={p.due<0?C.red:p.due<=3?C.org:p.due<=7?C.yel:C.grn}/>
              </div>
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{color:pc.color,fontWeight:700,fontSize:14}}>{fmt(p.amount)}</div>
            <Badge text={pc.label} color={pc.color}/>
          </div>
        </div>;
      })}
      {upcomingPayments.length>0&&<div style={{marginTop:10,display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:600}}>
        <span style={{color:C.tx2}}>Total vencendo</span>
        <span style={{color:C.red}}>{fmt(upcomingPayments.reduce((s,p)=>s+p.amount,0))}</span>
      </div>}
    </Card>

    {/* How to Use Guide */}
    <Card title="Agenda de Pagamentos — Fornecedores">
      <div style={{fontSize:12,color:C.tx2,marginBottom:12,lineHeight:1.7}}>
        Agende pagamentos futuros para fornecedores. Quando chegar o dia, clique em <strong style={{color:C.grn}}>"Pagar"</strong> e o sistema lança a despesa automaticamente.
      </div>

      {/* Form */}
      <div style={{background:C.bg3,border:`1px solid ${C.bg5}`,borderRadius:10,padding:"14px",marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:600,color:C.org,letterSpacing:.3,textTransform:"uppercase",marginBottom:10}}>Agendar Novo Pagamento</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
          <Field label="Data prevista">
            <input type="date" value={agForm.date} onChange={e=>setAgForm(p=>({...p,date:e.target.value}))} style={{background:C.bg4,border:`1px solid ${C.bg5}`,borderRadius:8,padding:"8px 10px",color:C.tx,fontSize:12,outline:"none",width:"100%"}} onFocus={e=>e.target.style.borderColor=C.blu} onBlur={e=>e.target.style.borderColor=C.bg5}/>
          </Field>
          <Field label="Valor (R$)">
            <input type="number" placeholder="0,00" value={agForm.amount} onChange={e=>setAgForm(p=>({...p,amount:e.target.value}))} style={{background:C.bg4,border:`1px solid ${C.bg5}`,borderRadius:8,padding:"8px 10px",color:C.tx,fontSize:12,outline:"none",width:"100%"}} onFocus={e=>e.target.style.borderColor=C.blu} onBlur={e=>e.target.style.borderColor=C.bg5}/>
          </Field>
          <Field label="Conta de saída">
            <select value={agForm.account} onChange={e=>setAgForm(p=>({...p,account:e.target.value}))} style={{background:C.bg4,border:`1px solid ${C.bg5}`,borderRadius:8,padding:"8px 10px",color:C.tx,fontSize:12,outline:"none",width:"100%",cursor:"pointer"}}>
              {accounts.map(a=><option key={a.id} value={a.id}>{a.icon} {a.name}</option>)}
            </select>
          </Field>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:8,marginBottom:10}}>
          <Field label="Fornecedor / Descrição">
            <input placeholder="Ex: Iogurte Danone, Alface José, Batatinha Atacadão..." value={agForm.description} onChange={e=>setAgForm(p=>({...p,description:e.target.value}))} style={{background:C.bg4,border:`1px solid ${C.bg5}`,borderRadius:8,padding:"8px 10px",color:C.tx,fontSize:12,outline:"none",width:"100%"}} onFocus={e=>e.target.style.borderColor=C.blu} onBlur={e=>e.target.style.borderColor=C.bg5}/>
          </Field>
          <Field label="Categoria">
            <select value={agForm.category} onChange={e=>setAgForm(p=>({...p,category:e.target.value}))} style={{background:C.bg4,border:`1px solid ${C.bg5}`,borderRadius:8,padding:"8px 10px",color:C.tx,fontSize:12,outline:"none",width:"100%",cursor:"pointer"}}>
              {Object.entries(EXP_CATS).map(([v,c])=><option key={v} value={v}>{c.l}</option>)}
            </select>
          </Field>
        </div>
        <Btn variant="warn" onClick={()=>{
          if(!agForm.amount||!agForm.description){return;}
          addAgendaItem({date:agForm.date||tod(),amount:parseFloat(agForm.amount),description:agForm.description,category:agForm.category,account:agForm.account});
          setAgForm(p=>({...p,amount:"",description:""}));
        }} full style={{fontSize:12}}>Agendar pagamento</Btn>
      </div>

      {/* Agenda List */}
      {agenda.length===0?
        <div style={{textAlign:"center",color:C.tx3,fontSize:13,padding:"14px"}}>Nenhum pagamento agendado. Use o formulário acima para agendar.</div>:
        <>
          {agenda.sort((a,b)=>a.date.localeCompare(b.date)).map(item=>{
            const due=daysU(item.date);
            const isToday=due<=0;
            const catLabel=EXP_CATS[item.category]?.l||item.category;
            const acctLabel=accounts.find(a=>a.id===item.account)?.name||item.account;
            return(
              <div key={item.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${C.bg5}`}}>
                <div style={{display:"flex",gap:10,alignItems:"center",flex:1}}>
                  <div style={{width:32,height:32,borderRadius:8,background:isToday?`${C.red}20`:`${C.org}15`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:isToday?C.red:C.org,flexShrink:0}}>
                    {due<=0?"!":due}
                  </div>
                  <div>
                    <div style={{fontSize:13,fontWeight:500,color:C.tx}}>{item.description}</div>
                    <div style={{fontSize:11,color:C.tx3}}>
                      {fmtD(item.date)} · {catLabel} · {acctLabel}
                      {isToday&&<span style={{color:C.red,fontWeight:600}}> · {due===0?"HOJE":"ATRASADO "+Math.abs(due)+"d"}</span>}
                      {!isToday&&due<=3&&<span style={{color:C.org,fontWeight:600}}> · em {due}d</span>}
                    </div>
                  </div>
                </div>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <span style={{fontWeight:700,fontSize:14,color:isToday?C.red:C.org,marginRight:6}}>{fmt(item.amount)}</span>
                  <Btn variant="success" onClick={()=>payAgendaItem(item)} style={{padding:"5px 10px",fontSize:11}}>Pagar ✓</Btn>
                  <button onClick={()=>removeAgendaItem(item.id)} style={{background:"none",border:"none",color:C.tx3,cursor:"pointer",fontSize:16,lineHeight:1}}>×</button>
                </div>
              </div>
            );
          })}
          <div style={{marginTop:10,display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:600}}>
            <span style={{color:C.tx2}}>Total agendado</span>
            <span style={{color:C.org}}>{fmt(agenda.reduce((s,a)=>s+a.amount,0))}</span>
          </div>
        </>
      }
    </Card>

    <Card title="Como Lançar — Passo a Passo">
      <div style={{fontSize:13,color:C.tx2,lineHeight:2}}>
        {[
          {step:"1",title:"Vendas do Caixa",desc:"Vá em RECEITAS → lance o total de vendas do dia. Conta: Caixa da Loja.",color:C.grn},
          {step:"2",title:"Sangria / Saída do Caixa",desc:"Vá em EXTRATO → Transferência. Ex: Caixa da Loja → Cofre. Isso NÃO afeta o DRE, só move o dinheiro.",color:C.org},
          {step:"3",title:"Pagar Conta (boleto, aluguel, folha)",desc:"Vá em DESPESAS → lance o pagamento com a categoria correta. Conta: Cofre (ou de onde saiu).",color:C.red},
          {step:"4",title:"Depósito no Banco",desc:"Vá em EXTRATO → Transferência. Ex: Cofre → Banco Itaú. Só movimenta, não duplica.",color:C.blu},
          {step:"5",title:"Pagar Parcela de Dívida",desc:"Vá em DÍVIDAS → abra a dívida → marque a parcela como paga. O sistema debita da conta escolhida.",color:C.pur},
        ].map(s=>(
          <div key={s.step} style={{display:"flex",gap:10,padding:"8px 0",borderBottom:`1px solid ${C.bg5}`}}>
            <span style={{width:24,height:24,borderRadius:6,background:`${s.color}20`,color:s.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,flexShrink:0}}>{s.step}</span>
            <div><strong style={{color:C.tx}}>{s.title}</strong><br/><span style={{fontSize:12}}>{s.desc}</span></div>
          </div>
        ))}
      </div>
      <div style={{marginTop:12,background:`${C.org}0c`,border:`1px solid ${C.org}25`,borderRadius:8,padding:"10px 13px",fontSize:12,lineHeight:1.8}}>
        <strong style={{color:C.org}}>Regra de ouro:</strong> Receita = dinheiro ENTRANDO. Despesa = dinheiro SAINDO para pagar algo. Transferência = dinheiro MUDANDO DE LUGAR (caixa → cofre → banco). Transferência NUNCA duplica no DRE.
      </div>
    </Card>
  </>);
}

function App(){
function WarRoomTab({enrichDebs,accounts,acctBalances,dailyBurn,totalDebt,revs,exps,totalCash,PC,C,fmt,fmtD,tod,daysU,Badge,Btn,Card,Kpi,TR,Field,projInterest}){
  const[survivalMode,setSurvivalMode]=useState(true);
  const[simDebtId,setSimDebtId]=useState("");
  const[simDelay,setSimDelay]=useState(15);
  const today=tod();
  const future15=useMemo(()=>{const d=new Date();d.setDate(d.getDate()+15);return d.toISOString().slice(0,10);},[]);
  const upcoming=useMemo(()=>{
    const items=[];
    enrichDebs.forEach(d=>{
      const due=daysU(d.dueDate);
      if(due<=15)items.push({...d,due,isVital:d.type==="vital",isRenegotiable:d.type==="banco"||d.type==="imposto"});
      (d.installments||[]).filter(i=>i.status==="pending").forEach(i=>{
        const idue=daysU(i.dueDate);
        if(idue<=15)items.push({id:i.id,creditor:`${d.creditor} — Parcela ${i.num}`,value:i.value,due:idue,dailyInterest:d.dailyInterest,type:d.type,priority:d.priority,isVital:d.type==="vital",isRenegotiable:d.type==="banco"||d.type==="imposto"});
      });
    });
    return items.sort((a,b)=>a.due-b.due);
  },[enrichDebs]);
  const vitalItems=upcoming.filter(d=>d.type==="vital"||d.type==="agiota");
  const renegItems=upcoming.filter(d=>d.type==="banco"||d.type==="imposto");
  const operItems=upcoming.filter(d=>d.type==="fornecedor"||d.type==="boleto");
  const totalUpcoming=upcoming.reduce((s,d)=>s+d.value,0);
  const avgDailyRev=useMemo(()=>{const d30=new Date();d30.setDate(d30.getDate()-30);const s30=d30.toISOString().slice(0,10);return revs.filter(r=>r.date>=s30).reduce((s,r)=>s+r.amount,0)/30;},[revs]);
  const projectedCash15=totalCash+(avgDailyRev*15)-totalUpcoming;
  const simDebt=enrichDebs.find(d=>d.id===simDebtId);
  const simResult=useMemo(()=>{if(!simDebt)return null;const costExtra=simDebt.remaining*simDebt.dailyInterest/100*simDelay;return{costExtra:Math.round(costExtra*100)/100,reliefToday:simDebt.remaining,newTotal:Math.round((simDebt.remaining+costExtra)*100)/100};},[simDebt,simDelay]);
  return(<>
    <div style={{display:"flex",gap:12,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <button onClick={()=>setSurvivalMode(!survivalMode)} style={{width:42,height:22,borderRadius:11,border:"none",cursor:"pointer",background:survivalMode?C.red:C.bg5,transition:"all .2s",position:"relative"}}><span style={{position:"absolute",top:2,left:survivalMode?22:2,width:18,height:18,borderRadius:"50%",background:"#fff",transition:"left .2s"}}/></button>
        <span style={{fontWeight:600,fontSize:13,color:survivalMode?C.red:C.tx3}}>Modo Sobrevivência</span>
      </div>
    </div>
    <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"}}>
      <Kpi v={fmt(totalCash)} l="Caixa Agora" color={totalCash>=0?C.grn:C.red}/>
      <Kpi v={fmt(avgDailyRev)} l="Faturamento Médio/Dia" color={C.blu}/>
      <Kpi v={fmt(totalUpcoming)} l="Vence em 15 dias" color={C.org}/>
      <Kpi v={fmt(projectedCash15)} l="Caixa Projetado (15d)" color={projectedCash15>=0?C.grn:C.red} sub={projectedCash15<0?"CRÍTICO":null}/>
    </div>
    {projectedCash15<0&&<div style={{background:`${C.red}0d`,border:`1px solid ${C.red}30`,borderRadius:10,padding:"12px 16px",marginBottom:14,fontSize:13,lineHeight:1.7}}>
      <strong style={{color:C.red}}>ALERTA CRÍTICO:</strong> Em 15 dias faltam <strong style={{color:C.red}}>{fmt(Math.abs(projectedCash15))}</strong>. Precisa renegociar ou aumentar faturamento em <strong style={{color:C.org}}>{fmt(Math.abs(projectedCash15)/15)}/dia</strong>.
    </div>}
    <Card title="Matriz de Sobrevivência — Próximos 15 Dias">
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
        <div style={{background:`${C.red}08`,border:`1px solid ${C.red}25`,borderRadius:10,padding:"14px"}}>
          <div style={{fontSize:11,fontWeight:600,color:C.red,letterSpacing:.3,textTransform:"uppercase",marginBottom:10}}>Vital — Pagar Primeiro ({vitalItems.length})</div>
          {vitalItems.length===0?<div style={{fontSize:12,color:C.tx3}}>Nenhum</div>:vitalItems.map(d=><div key={d.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px solid ${C.bg5}`,fontSize:12}}><span style={{color:C.tx2}}>{d.creditor?.slice(0,22)}</span><div style={{display:"flex",gap:6,alignItems:"center"}}><Badge text={d.due<=0?`${Math.abs(d.due)}d atraso`:`${d.due}d`} color={d.due<=0?C.red:C.org}/><strong style={{color:C.red}}>{fmt(d.value)}</strong></div></div>)}
          <div style={{marginTop:8,fontSize:13,fontWeight:700,color:C.red}}>Total: {fmt(vitalItems.reduce((s,d)=>s+d.value,0))}</div>
        </div>
        <div style={{background:`${C.org}08`,border:`1px solid ${C.org}25`,borderRadius:10,padding:"14px"}}>
          <div style={{fontSize:11,fontWeight:600,color:C.org,letterSpacing:.3,textTransform:"uppercase",marginBottom:10}}>Operacional ({operItems.length})</div>
          {operItems.length===0?<div style={{fontSize:12,color:C.tx3}}>Nenhum</div>:operItems.map(d=><div key={d.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px solid ${C.bg5}`,fontSize:12}}><span style={{color:C.tx2}}>{d.creditor?.slice(0,22)}</span><strong style={{color:C.org}}>{fmt(d.value)}</strong></div>)}
          <div style={{marginTop:8,fontSize:13,fontWeight:700,color:C.org}}>Total: {fmt(operItems.reduce((s,d)=>s+d.value,0))}</div>
        </div>
        <div style={{background:`${C.blu}08`,border:`1px solid ${C.blu}25`,borderRadius:10,padding:"14px"}}>
          <div style={{fontSize:11,fontWeight:600,color:C.blu,letterSpacing:.3,textTransform:"uppercase",marginBottom:10}}>Renegociável ({renegItems.length})</div>
          {renegItems.length===0?<div style={{fontSize:12,color:C.tx3}}>Nenhum</div>:renegItems.map(d=><div key={d.id} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px solid ${C.bg5}`,fontSize:12}}><span style={{color:C.tx2}}>{d.creditor?.slice(0,22)}</span><strong style={{color:C.blu}}>{fmt(d.value)}</strong></div>)}
          <div style={{marginTop:8,fontSize:13,fontWeight:700,color:C.blu}}>Total: {fmt(renegItems.reduce((s,d)=>s+d.value,0))}</div>
        </div>
      </div>
    </Card>
    <Card title="Simulador de Respiro — E se eu atrasar?">
      <div style={{fontSize:12,color:C.tx2,marginBottom:12,lineHeight:1.7}}>Selecione uma dívida e simule um atraso.</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        <Field label="Dívida para simular"><select value={simDebtId} onChange={e=>setSimDebtId(e.target.value)} style={{...inp}}><option value="">Selecionar...</option>{enrichDebs.map(d=><option key={d.id} value={d.id}>{d.creditor} — {fmt(d.remaining)} @ {d.dailyInterest}%/dia</option>)}</select></Field>
        <Field label={`Atrasar por ${simDelay} dias`}><input type="range" min="1" max="90" value={simDelay} onChange={e=>setSimDelay(+e.target.value)} style={{width:"100%"}}/></Field>
      </div>
      {simResult&&simDebt&&<>
        <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"}}>
          <Kpi v={fmt(simResult.reliefToday)} l="Alívio no Caixa Hoje" color={C.grn}/>
          <Kpi v={fmt(simResult.costExtra)} l={`Custo Extra (${simDelay}d)`} color={C.red}/>
          <Kpi v={fmt(simResult.newTotal)} l={`Saldo em ${simDelay}d`} color={C.org}/>
        </div>
        <div style={{background:simResult.costExtra>simResult.reliefToday*0.1?`${C.red}0c`:`${C.grn}0c`,border:`1px solid ${simResult.costExtra>simResult.reliefToday*0.1?`${C.red}30`:`${C.grn}30`}`,borderRadius:8,padding:"11px 14px",fontSize:12,lineHeight:1.8}}>
          {simResult.costExtra>simResult.reliefToday*0.1
            ?<><strong style={{color:C.red}}>NÃO COMPENSA:</strong> Custo de {fmt(simResult.costExtra)} é {((simResult.costExtra/simResult.reliefToday)*100).toFixed(1)}% do valor.</>
            :<><strong style={{color:C.grn}}>PODE ATRASAR:</strong> Custo de {fmt(simResult.costExtra)} é baixo ({((simResult.costExtra/simResult.reliefToday)*100).toFixed(1)}%).</>
          }
        </div>
      </>}
    </Card>
  </>);
}

function ReportsTab({revs,exps,monthlyDRE,C,fmt,fmtD,Badge,Card,Kpi,TR}){
  const MESES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const yoyData=useMemo(()=>{const map={};revs.forEach(r=>{const d=new Date(r.date+"T12:00");const mo=d.getMonth();const yr=d.getFullYear();if(!map[mo])map[mo]={month:MESES[mo]};map[mo][`rev_${yr}`]=(map[mo][`rev_${yr}`]||0)+r.amount;});return Object.values(map).sort((a,b)=>MESES.indexOf(a.month)-MESES.indexOf(b.month));},[revs]);
  const years=useMemo(()=>{const yrs=new Set();revs.forEach(r=>yrs.add(new Date(r.date+"T12:00").getFullYear()));return[...yrs].sort();},[revs]);
  const yrColors=["#6366f1","#10b981","#f97316","#eab308","#f43f5e"];
  const yoyTable=useMemo(()=>{
    const map={};const yearsSet=new Set();
    revs.forEach(r=>{const d=new Date(r.date+"T12:00");const yr=d.getFullYear(),mo=d.getMonth();yearsSet.add(yr);map[`${yr}_${mo}`]=(map[`${yr}_${mo}`]||0)+r.amount;});
    const sortedYears=[...yearsSet].sort();
    const rows=MESES.map((mesNome,mo)=>{const row={month:mesNome};sortedYears.forEach(yr=>{row[`rev_${yr}`]=map[`${yr}_${mo}`]||0;});if(sortedYears.length>=2){const cur=sortedYears[sortedYears.length-1],prev=sortedYears[sortedYears.length-2];const vCur=map[`${cur}_${mo}`]||0,vPrev=map[`${prev}_${mo}`]||0;row.growth=vPrev>0?((vCur-vPrev)/vPrev)*100:vCur>0?100:0;row.hasData=vCur>0||vPrev>0;}return row;});
    const totals={month:"Total"};sortedYears.forEach(yr=>{totals[`rev_${yr}`]=rows.reduce((s,r)=>s+(r[`rev_${yr}`]||0),0);});
    if(sortedYears.length>=2){const cur=sortedYears[sortedYears.length-1],prev=sortedYears[sortedYears.length-2];totals.growth=totals[`rev_${prev}`]>0?((totals[`rev_${cur}`]-totals[`rev_${prev}`])/totals[`rev_${prev}`])*100:0;}
    return{rows,totals,years:sortedYears};
  },[revs]);
  const heatmapData=useMemo(()=>{const map={};revs.forEach(r=>{const day=new Date(r.date+"T12:00").getDate();map[day]=(map[day]||0)+r.amount;});return Array.from({length:31},(_,i)=>({day:i+1,total:map[i+1]||0}));},[revs]);
  const maxHeat=Math.max(...heatmapData.map(d=>d.total),1);
  const topDrains=useMemo(()=>{const now=new Date();const curMonth=now.getMonth();const curYear=now.getFullYear();const recent={},older={};exps.forEach(e=>{const d=new Date(e.date+"T12:00");const mo=d.getMonth();const yr=d.getFullYear();const cat=e.category;if(yr===curYear&&mo>=curMonth-2){recent[cat]=(recent[cat]||0)+e.amount;}else{older[cat]=(older[cat]||0)+e.amount;}});return Object.keys(recent).map(cat=>{const r=recent[cat]||0,o=older[cat]||1;return{cat,recent:r,older:o,growth:((r-o)/o)*100};}).sort((a,b)=>b.growth-a.growth).slice(0,5);},[exps]);
  const EXP_CATS={folha:"Folha",aluguel:"Aluguel",energia:"Energia",contador:"Contador",sistema:"Software",marketing:"Marketing",manutencao:"Manutenção",embalagens:"Embalagens",financeiro:"Juros/Taxas",imposto:"Impostos",outros:"Outros"};
  return(<>
    <Card title="Faturamento Anual — Comparativo" noPad>
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:600}}><thead><tr style={{background:C.bg3}}><th style={{padding:"10px 14px",textAlign:"left",borderBottom:`1px solid ${C.bg5}`,color:C.tx3,fontWeight:600,fontSize:11,minWidth:70}}>Mês</th>{yoyTable.years.map(yr=><th key={yr} style={{padding:"10px 14px",textAlign:"right",borderBottom:`1px solid ${C.bg5}`,color:C.tx,fontWeight:600,fontSize:12,minWidth:110}}>{yr}</th>)}{yoyTable.years.length>=2&&<><th style={{padding:"10px 14px",textAlign:"right",borderBottom:`1px solid ${C.bg5}`,color:C.org,fontWeight:600,fontSize:11,minWidth:90}}>Crescimento</th><th style={{padding:"10px 14px",textAlign:"center",borderBottom:`1px solid ${C.bg5}`,color:C.tx3,fontWeight:500,fontSize:11,width:50}}>%</th></>}</tr></thead>
      <tbody>{yoyTable.rows.map((row,i)=>{const hasValues=yoyTable.years.some(yr=>row[`rev_${yr}`]>0);if(!hasValues)return null;return(<tr key={row.month} style={{background:i%2===0?"transparent":`${C.bg3}50`,borderBottom:`1px solid ${C.bg5}`}}><td style={{padding:"9px 14px",fontWeight:600,color:C.tx,fontSize:12}}>{row.month}</td>{yoyTable.years.map(yr=>{const val=row[`rev_${yr}`]||0;return<td key={yr} style={{padding:"9px 14px",textAlign:"right",color:val>0?C.tx:C.tx3,fontWeight:val>0?500:400,fontSize:12}}>{val>0?new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(val):"—"}</td>;})}{yoyTable.years.length>=2&&<><td style={{padding:"9px 14px",textAlign:"right"}}>{row.hasData&&row.growth!=null?<span style={{color:row.growth>0?C.grn:row.growth<0?C.red:C.tx3,fontWeight:600,fontSize:12}}>{row.growth>0?"▲":row.growth<0?"▼":"—"} {Math.abs(row.growth).toFixed(2)}%</span>:<span style={{color:C.tx3}}>—</span>}</td><td style={{padding:"9px 14px",textAlign:"center"}}>{row.hasData&&row.growth!=null?<div style={{width:"100%",height:6,borderRadius:3,background:C.bg4,overflow:"hidden",minWidth:40}}><div style={{height:"100%",borderRadius:3,width:`${Math.min(Math.abs(row.growth),100)}%`,background:row.growth>0?C.grn:C.red}}/></div>:null}</td></>}</tr>);})}
      <tr style={{background:C.bg3,borderTop:`2px solid ${C.bg5}`}}><td style={{padding:"11px 14px",fontWeight:700,color:C.tx,fontSize:13}}>Total Ano</td>{yoyTable.years.map(yr=><td key={yr} style={{padding:"11px 14px",textAlign:"right",fontWeight:700,color:C.grn,fontSize:13}}>{new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(yoyTable.totals[`rev_${yr}`]||0)}</td>)}{yoyTable.years.length>=2&&<><td style={{padding:"11px 14px",textAlign:"right"}}><span style={{color:yoyTable.totals.growth>0?C.grn:C.red,fontWeight:700,fontSize:13}}>{yoyTable.totals.growth>0?"▲":"▼"} {Math.abs(yoyTable.totals.growth||0).toFixed(2)}%</span></td><td/></>}</tr></tbody></table></div>
    </Card>
    <Card title="Faturamento — Comparativo Anual"><div style={{height:220}}><ResponsiveContainer width="100%" height="100%"><BarChart data={yoyData} margin={{top:4,right:14,bottom:0,left:6}}><XAxis dataKey="month" tick={{fill:C.tx3,fontSize:11}} axisLine={false} tickLine={false}/><YAxis tick={{fill:C.tx3,fontSize:11}} tickFormatter={v=>`R$${(v/1000).toFixed(0)}k`} axisLine={false} tickLine={false}/><Tooltip formatter={v=>[fmt(v)]} contentStyle={{background:C.bg2,border:`1px solid ${C.bg5}`,color:C.tx,fontSize:12,borderRadius:8}}/><Legend wrapperStyle={{fontSize:11,color:C.tx2,paddingTop:8}}/>{years.map((yr,i)=><Bar key={yr} dataKey={`rev_${yr}`} name={`${yr}`} fill={yrColors[i%yrColors.length]} opacity={.8} radius={[4,4,0,0]}/>)}</BarChart></ResponsiveContainer></div></Card>
    <Card title="Picos de Venda — Por Dia do Mês"><div style={{fontSize:12,color:C.tx2,marginBottom:12}}>Dias com maior volume de receitas.</div><div style={{display:"grid",gridTemplateColumns:"repeat(16,1fr)",gap:3}}>{heatmapData.map(d=>{const intensity=d.total/maxHeat;const bg=d.total===0?C.bg4:`rgba(16,185,129,${0.15+intensity*0.75})`;return<div key={d.day} title={`Dia ${d.day}: ${fmt(d.total)}`} style={{aspectRatio:"1",borderRadius:4,background:bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:intensity>0.5?"#fff":C.tx3,fontWeight:intensity>0.5?700:400}}>{d.day}</div>;})}</div></Card>

          {Math.abs(diff)>20&&Math.abs(diff)<=100&&<><strong style={{color:C.org}}>Atenção:</strong> Diferença de {fmt(diff)}. Verificar troco/sangria.</>}

  const[session,setSession]=useState(null);

  useEffect(()=>{sb.auth.getSession().then(({data})=>{setSession(data.session||null);setAuthReady(true);});const{data:sub}=sb.auth.onAuthStateChange((_ev,s)=>{setSession(s||null);});return()=>sub?.subscription?.unsubscribe();},[]);
  const syncedRef=useRef({revs:[],exps:[],debs:[],xfers:[],accounts:[],agenda:[]});

              {isExp&&d.status!=="paid"&&inst.length===0&&<div style={{marginTop:10,paddingTop:8,borderTop:`1px solid ${C.bg5}`}}><div style={{fontSize:11,color:C.tx3,fontWeight:500,letterSpacing:.3,textTransform:"uppercase",marginBottom:7}}>Registrar pagamento</div><div style={{display:"flex",gap:8}}><input id={`pay-${d.id}`} type="number" placeholder="Valor (R$)" style={{...inp,flex:1,padding:"7px 10px",fontSize:12}}/><select id={`payacct-${d.id}`} defaultValue="cofre" style={{...inp,width:110,padding:"7px 8px",fontSize:11}}>{accounts.map(a=><option key={a.id} value={a.id}>{a.icon} {a.name.slice(0,12)}</option>)}</select><Btn variant="success" onClick={()=>{const el=document.getElementById(`pay-${d.id}`);const ac=document.getElementById(`payacct-${d.id}`);addPayment(d.id,el?.value,"Pagamento parcial",ac?.value||"cofre");if(el)el.value="";}} style={{padding:"7px 13px",fontSize:12}}>Registrar</Btn></div></div>}
              {isEdit&&<div style={{marginTop:12,paddingTop:10,borderTop:`1px solid ${C.blu}30`,background:`${C.blu}08`,borderRadius:8,padding:12,marginLeft:-4,marginRight:-4}}><div style={{fontSize:11,color:C.blu,fontWeight:600,letterSpacing:.3,textTransform:"uppercase",marginBottom:8}}>Editar Dívida</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}><div><label style={{display:"block",fontSize:10,color:C.tx3,marginBottom:4}}>Credor</label><input style={{...inp,fontSize:12,padding:"7px 9px"}} defaultValue={d.creditor} onBlur={e=>editDebt(d.id,{creditor:e.target.value})}/></div><div><label style={{display:"block",fontSize:10,color:C.tx3,marginBottom:4}}>Valor (R$)</label><input style={{...inp,fontSize:12,padding:"7px 9px"}} type="number" defaultValue={d.value} onBlur={e=>editDebt(d.id,{value:parseFloat(e.target.value)||d.value})}/></div><div><label style={{display:"block",fontSize:10,color:C.tx3,marginBottom:4}}>Vencimento</label><input style={{...inp,fontSize:12,padding:"7px 9px"}} type="date" defaultValue={d.dueDate} onBlur={e=>editDebt(d.id,{dueDate:e.target.value||d.dueDate})}/></div><div><label style={{display:"block",fontSize:10,color:C.tx3,marginBottom:4}}>Juros %/dia</label><input style={{...inp,fontSize:12,padding:"7px 9px"}} type="number" step="0.1" defaultValue={d.dailyInterest} onBlur={e=>editDebt(d.id,{dailyInterest:parseFloat(e.target.value)||0})}/></div><div><label style={{display:"block",fontSize:10,color:C.tx3,marginBottom:4}}>Tipo</label><select style={{...inp,fontSize:12,padding:"7px 9px"}} defaultValue={d.type} onChange={e=>editDebt(d.id,{type:e.target.value})}>{DTYPES.map(t=><option key={t.v} value={t.v}>{t.l}</option>)}</select></div><div><label style={{display:"block",fontSize:10,color:C.tx3,marginBottom:4}}>Notas</label><input style={{...inp,fontSize:12,padding:"7px 9px"}} defaultValue={d.notes} onBlur={e=>editDebt(d.id,{notes:e.target.value})}/></div></div><div style={{marginTop:8,textAlign:"right"}}><Btn variant="blue" onClick={()=>{setEditId(null);toast_("Dívida atualizada");}} style={{padding:"6px 14px",fontSize:11}}>Fechar edição</Btn></div></div>}
              {isProj&&d.dailyInterest>0&&<div style={{marginTop:12,paddingTop:10,borderTop:`1px solid ${C.org}30`}}><div style={{fontSize:11,color:C.org,fontWeight:600,letterSpacing:.3,textTransform:"uppercase",marginBottom:10}}>Projeção de Juros — {d.creditor}</div><div style={{display:"flex",gap:10,marginBottom:10,flexWrap:"wrap"}}><Kpi v={fmt(proj30.interest)} l="Juros em 30 dias" color={C.org}/><Kpi v={fmt(proj30.total)} l="Saldo em 30 dias" color={C.red}/><Kpi v={fmt(proj90.total)} l="Saldo em 90 dias" color={C.red}/></div><div style={{background:`${C.red}0c`,border:`1px solid ${C.red}28`,borderRadius:8,padding:"10px 12px",fontSize:12,lineHeight:1.7}}>Se não pagar nada, em 30 dias: <strong style={{color:C.red}}>{fmt(proj30.total)}</strong> (+{fmt(proj30.interest)}). Em 90 dias: <strong style={{color:C.red}}>{fmt(proj90.total)}</strong>.{d.type==="agiota"&&<span style={{color:C.org}}> Cada R$100 pagos hoje economizam R${(100*d.dailyInterest/100*30).toFixed(0)} em 30 dias.</span>}</div></div>}
              {!isExp&&(inst.length>0||pays.length>0)&&<div onClick={()=>setExpandId(d.id)} style={{marginTop:5,fontSize:10,color:C.blu,cursor:"pointer",textAlign:"center",paddingTop:5}}>▼ {inst.length>0?`${inst.length} parcelas`:""}{pays.length>0?` · ${pays.length} pagamentos`:""}</div>}

            </div>);

            {accounts.map(a=><div key={a.id} onClick={()=>setSelAcct(a.id)} style={{background:selAcct===a.id?`${C.blu}15`:C.bg2,border:`1px solid ${selAcct===a.id?C.blu:C.bg5}`,borderRadius:10,padding:"12px 15px",flex:1,minWidth:130,cursor:"pointer"}}><div style={{fontSize:18,marginBottom:4}}>{a.icon}</div><div style={{color:acctBalances[a.id]>=0?C.grn:C.red,fontWeight:700,fontSize:18}}>{fmt(acctBalances[a.id]||0)}</div><div style={{fontSize:10,color:selAcct===a.id?C.blu:C.tx3,marginTop:3,fontWeight:selAcct===a.id?600:400}}>{a.name}</div></div>)}
            <div onClick={()=>setSelAcct("all")} style={{background:selAcct==="all"?`${C.org}15`:C.bg2,border:`1px solid ${selAcct==="all"?C.org:C.bg5}`,borderRadius:10,padding:"12px 15px",minWidth:130,cursor:"pointer"}}><div style={{fontSize:18,marginBottom:4}}>📊</div><div style={{color:totalCash>=0?C.grn:C.red,fontWeight:700,fontSize:18}}>{fmt(totalCash)}</div><div style={{fontSize:10,color:selAcct==="all"?C.org:C.tx3,marginTop:3}}>Consolidado</div></div>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center"}}>
            {!showAddAcct?<Btn onClick={()=>setShowAddAcct(true)} style={{fontSize:12}}>+ Nova Conta</Btn>:<><input placeholder="Nome da conta" value={newAcct.name} onChange={e=>setNewAcct(p=>({...p,name:e.target.value}))} style={{...inp,flex:1,padding:"7px 10px",fontSize:12}}/><select value={newAcct.type} onChange={e=>setNewAcct(p=>({...p,type:e.target.value}))} style={{...inp,width:100,padding:"7px 9px",fontSize:11}}><option value="bank">🏦 Banco</option><option value="physical">🏪 Físico</option></select><Btn variant="success" onClick={addNewAcct} style={{padding:"7px 12px",fontSize:12}}>Criar</Btn><Btn variant="ghost" onClick={()=>setShowAddAcct(false)} style={{padding:"7px 9px",fontSize:12}}>×</Btn></>}
          </div>
          <Card title="Transferência entre Contas">

            <div style={{display:"grid",gridTemplateColumns:"1fr auto 1fr 1fr 1fr",gap:8,alignItems:"end"}}>
              <Sel label="Origem" opts={accounts.map(a=>({v:a.id,l:`${a.icon} ${a.name.slice(0,13)}`}))} value={xfForm.from} onChange={e=>setXfForm(p=>({...p,from:e.target.value}))}/>

            <div style={{display:"flex",gap:8,marginTop:10}}><input placeholder="Descrição (Sangria Caixa → Cofre...)" value={xfForm.description} onChange={e=>setXfForm(p=>({...p,description:e.target.value}))} style={{...inp,flex:1,padding:"9px 11px",fontSize:12}}/><Btn variant="warn" onClick={addTransfer} style={{padding:"9px 16px",fontSize:12}}>Transferir</Btn></div>
          </Card>
          <Card title={`Extrato — ${selAcct==="all"?"Consolidado":acctName(selAcct)}`} action={dateRange.label} noPad>
            <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:540}}><thead><tr>{["Data","Tipo",selAcct==="all"&&"Conta","Descrição","Entrada","Saída","Saldo"].filter(Boolean).map(h=><th key={h} style={{padding:"10px 14px",textAlign:h==="Entrada"||h==="Saída"||h==="Saldo"?"right":"left",borderBottom:`1px solid ${C.bg5}`,color:C.tx3,fontWeight:500,fontSize:11}}>{h}</th>)}</tr></thead>
            <tbody>{(()=>{
              const fl=ledger.filter(e=>e.date>=dateRange.s&&e.date<=dateRange.e).filter(e=>selAcct==="all"||e.account===selAcct);let rb=0;
              const tl={receita:"Receita",despesa:"Despesa",transf_saida:"Transf. Saída",transf_entrada:"Transf. Entrada",pgto_divida:"Pgto Dívida"};
              const tc={receita:C.grn,despesa:C.red,transf_saida:C.org,transf_entrada:C.blu,pgto_divida:C.red};
              return fl.length===0?<tr><td colSpan={selAcct==="all"?7:6} style={{padding:"20px",textAlign:"center",color:C.tx3}}>Nenhuma movimentação no período.</td></tr>:fl.map(e=>{rb+=e.amount*e.sign;return<tr key={e.id} style={{borderBottom:`1px solid ${C.bg5}`}}><td style={{padding:"8px 14px",color:C.tx3,whiteSpace:"nowrap"}}>{fmtD(e.date)}</td><td style={{padding:"8px 14px"}}><Badge text={tl[e.type]||e.type} color={tc[e.type]||C.tx3}/></td>{selAcct==="all"&&<td style={{padding:"8px 14px",color:C.tx2,fontSize:11}}>{acctName(e.account).slice(0,14)}</td>}<td style={{padding:"8px 14px",color:C.tx2,maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.desc?.slice(0,35)}</td><td style={{padding:"8px 14px",textAlign:"right",color:C.grn,fontWeight:e.sign>0?600:400}}>{e.sign>0?fmt(e.amount):""}</td><td style={{padding:"8px 14px",textAlign:"right",color:C.red,fontWeight:e.sign<0?600:400}}>{e.sign<0?fmt(e.amount):""}</td><td style={{padding:"8px 14px",textAlign:"right",color:rb>=0?C.grn:C.red,fontWeight:700}}>{fmt(rb)}</td></tr>;})
            })()}</tbody></table></div>
            {(()=>{const fl=ledger.filter(e=>e.date>=dateRange.s&&e.date<=dateRange.e).filter(e=>selAcct==="all"||e.account===selAcct);const tI=fl.filter(e=>e.sign>0).reduce((s,e)=>s+e.amount,0);const tO=fl.filter(e=>e.sign<0).reduce((s,e)=>s+e.amount,0);return fl.length>0?<div style={{display:"flex",justifyContent:"space-between",padding:"12px 18px",borderTop:`1px solid ${C.bg5}`,fontSize:13}}><span style={{color:C.grn,fontWeight:600}}>Entradas: {fmt(tI)}</span><span style={{color:C.red,fontWeight:600}}>Saídas: {fmt(tO)}</span><span style={{color:tI-tO>=0?C.grn:C.red,fontWeight:700}}>Saldo: {fmt(tI-tO)}</span></div>:null;})()}
          </Card>
        </>}

          <Card title="DRE — Tabela" noPad><div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:480}}><thead><tr><th style={{textAlign:"left",padding:"11px 18px",borderBottom:`1px solid ${C.bg5}`,color:C.tx3,fontWeight:500,minWidth:180}}>Linha DRE</th>{monthlyDRE.map(m=><th key={m.ym} style={{textAlign:"right",padding:"11px 14px",borderBottom:`1px solid ${C.bg5}`,color:C.tx3,fontWeight:500}}>{m.label}</th>)}<th style={{textAlign:"right",padding:"11px 14px",borderBottom:`1px solid ${C.bg5}`,color:C.org,fontWeight:600}}>Total</th></tr></thead><tbody>{[{key:"rev",label:"(+) Receita Bruta",bold:false,color:C.grn,neg:false,tot:periodTot.rev},{key:"cmvAmt",label:`(-) CMV (${cmv}%)`,bold:false,color:C.org,neg:true,tot:-periodTot.cmvAmt},{key:"gp",label:"= Lucro Bruto",bold:true,color:C.blu,neg:false,tot:periodTot.gp},{key:"fixE",label:"(-) Desp. Fixas",bold:false,color:C.red,neg:true,tot:-periodTot.fixE},{key:"varE",label:"(-) Desp. Variáveis",bold:false,color:C.yel,neg:true,tot:-periodTot.varE},{key:"ebitda",label:"= EBITDA",bold:true,color:null,neg:false,tot:periodTot.ebitda},{key:"finE",label:"(-) Desp. Financeiras",bold:false,color:C.red,neg:true,tot:-periodTot.finE},{key:"net",label:"= Resultado Líquido",bold:true,color:null,neg:false,tot:periodTot.net},{key:"margin",label:"Margem Líquida",bold:false,color:C.tx3,neg:false,pct:true,tot:periodTot.margin}].map(row=><tr key={row.key} style={{borderBottom:`1px solid ${C.bg5}`}}><td style={{padding:"9px 18px",color:row.bold?C.tx:C.tx2,fontWeight:row.bold?600:400,background:row.bold?C.bg3:"transparent"}}>{row.label}</td>{monthlyDRE.map(m=>{const raw=m[row.key]||0,val=row.neg?-raw:raw,c=row.color||(val>=0?C.grn:C.red);return<td key={m.ym} style={{padding:"9px 14px",textAlign:"right",color:c,fontWeight:row.bold?700:400,background:row.bold?C.bg3:"transparent"}}>{row.pct?`${raw.toFixed(1)}%`:fmt(val)}</td>;})}<td style={{padding:"9px 14px",textAlign:"right",fontWeight:700,color:row.pct?C.tx2:((row.tot||0)>=0?C.grn:C.red),borderLeft:`1px solid ${C.bg5}`,background:row.bold?C.bg3:"transparent"}}>{row.pct?`${(row.tot||0).toFixed(1)}%`:fmt(row.tot||0)}</td></tr>)}</tbody></table></div></Card>

        {tab==="historico"&&<ReportsTab revs={revs} exps={exps} monthlyDRE={monthlyDRE} C={C} fmt={fmt} fmtD={fmtD} Badge={Badge} Card={Card} Kpi={Kpi} TR={TR}/>}

              <Sel label="Coluna de Valor" opts={imp.headers.map(h=>({v:h,l:h}))} value={icols.amount} onChange={e=>setIcols(p=>({...p,amount:e.target.value}))}/>

          </Card>}
          {txs.length>0&&<Card title="Transações Importadas" action={`${txs.length} total`} noPad><div style={{padding:"0 18px"}}>{txs.slice(0,20).map(t=><TR key={t.id} left={<div style={{display:"flex",gap:9,alignItems:"center",fontSize:12}}><span style={{color:C.tx3}}>{t.date}</span><Badge text={t.type==="credit"?"Entrada":"Saída"} color={t.type==="credit"?C.grn:C.red}/><span style={{color:C.tx2}}>{t.description?.slice(0,30)}</span></div>} right={<span style={{fontWeight:600,color:t.type==="credit"?C.grn:C.red,fontSize:13}}>{fmt(t.amount)}</span>}/>)}</div></Card>}
        </>}

        {/* ─── CONSULTOR IA (IMPROVED) ─── */}
        {tab==="consultor"&&<>
          <div style={{background:C.bg2,border:`1px solid ${C.bg5}`,borderRadius:12,padding:"14px 18px",marginBottom:12,display:"flex",gap:12,alignItems:"flex-start"}}>
            <div style={{width:30,height:30,borderRadius:8,background:C.blu,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>✦</div>
            <div><div style={{fontWeight:600,fontSize:14,marginBottom:3}}>Consultor Financeiro com IA</div><div style={{fontSize:13,color:C.tx2,lineHeight:1.7}}>Diagnóstico completo baseado nos dados reais: DRE, dívidas, contas fixas, vencimentos próximos e fluxo de caixa.</div></div>
          </div>
          <Card title="Dados enviados para análise">
            {[["Períodos",monthlyDRE.map(m=>m.label).join(", ")||"Nenhum",C.blu],["Receita total",fmt(filtRevs.reduce((s,r)=>s+r.amount,0)),C.grn],["Despesas totais",fmt(filtExps.reduce((s,e)=>s+e.amount,0)),C.red],["Dívidas ativas",`${enrichDebs.length} — ${fmt(totalDebt)}`,C.red],["Queima diária",`${fmt(dailyBurn)}/dia`,C.org],["Caixa atual",fmt(totalCash),totalCash>=0?C.grn:C.red],["Vencimentos 15d",`${upcoming15d.length} — ${fmt(upcoming15d.reduce((s,u)=>s+u.amount,0))}`,C.org],["Resultado",fmt(periodTot.net),periodTot.net>=0?C.grn:C.red]].map(([l,v,c])=><TR key={l} left={<span style={{fontSize:13,color:C.tx2}}>{l}</span>} right={<span style={{fontSize:13,fontWeight:600,color:c}}>{v}</span>}/>)}
          </Card>
          <Card title="Contexto adicional (opcional)">
            <Field label="Descreva detalhes específicos"><textarea value={ai.ctx} onChange={e=>setAi(p=>({...p,ctx:e.target.value}))} placeholder="Ex: Meu pai controla o caixa e não anota nada. Temos quinzena dia 20 e não sabemos de onde tirar. Fornecedor X ameaçou cortar..." style={{...inp,height:80,resize:"vertical",display:"block"}} onFocus={e=>e.target.style.borderColor=C.blu} onBlur={e=>e.target.style.borderColor=C.bg5}/></Field>
          </Card>
          <Btn variant="blue" onClick={getAI} full style={{padding:"13px",fontSize:14,fontWeight:700,marginBottom:12}}>{ai.load?"Analisando dados...":"Gerar diagnóstico + plano de ação"}</Btn>
          {ai.load&&<div style={{background:C.bg2,border:`1px solid ${C.bg5}`,borderRadius:12,padding:"28px",textAlign:"center",color:C.tx3,fontSize:13}}><div style={{fontSize:22,marginBottom:10}}>⏳</div>Lendo DRE, dívidas, contas fixas e vencimentos...</div>}
          {ai.resp&&!ai.load&&<Card title="Diagnóstico & Plano de Ação"><div style={{fontSize:13,lineHeight:2,color:C.tx2,whiteSpace:"pre-wrap"}}>{ai.resp}</div><div style={{marginTop:14,paddingTop:12,borderTop:`1px solid ${C.bg5}`,display:"flex",gap:10}}><Btn variant="blue" onClick={getAI} style={{fontSize:12}}>Atualizar</Btn><Btn variant="ghost" onClick={()=>setAi(p=>({...p,resp:""}))} style={{fontSize:12}}>Limpar</Btn></div></Card>}
          <Card title="Guia de Prioridades">
            {[[C.red,"Agiota é prioridade máxima","Juros de 3–5%/dia duplicam a dívida em ~20 dias. Quite ou negocie primeiro."],[C.org,"Estoque antes de banco","Sem mercadoria não há faturamento. Utilidades e estoque são inegociáveis."],[C.yel,"Fornecedores preferem acordo","Proponha 30–40% à vista + parcelamento. A maioria aceita para não perder o cliente."],[C.blu,"Banco é o mais lento","Negocie banco depois de quitar agiotas e fornecedores."],[C.grn,"Registro diário é obrigatório","Todo centavo que entra ou sai deve ser lançado. Sem histórico não há diagnóstico."]].map(([c,t,d])=><div key={t} style={{padding:"11px 0",borderBottom:`1px solid ${C.bg5}`}}><div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4}}><span style={{width:6,height:6,borderRadius:"50%",background:c,flexShrink:0,display:"inline-block"}}/><span style={{fontWeight:600,fontSize:13}}>{t}</span></div><div style={{fontSize:12,color:C.tx2,lineHeight:1.7,paddingLeft:14}}>{d}</div></div>)}
          </Card>
        </>}

        {/* ─── RELATÓRIO (IMPROVED with vencimentos) ─── */}
        {tab==="relatorio"&&<>
          <div className="no-print" style={{display:"flex",gap:12,marginBottom:14,alignItems:"center",flexWrap:"wrap"}}>
            <div style={{flex:1,fontSize:13,color:C.tx2,lineHeight:1.7}}>Relatório de <strong style={{color:C.org}}>{dateRange.label}</strong></div>
            <Btn variant="success" onClick={()=>window.print()} style={{padding:"10px 22px",fontWeight:700}}>Imprimir / PDF</Btn>
          </div>
          <div className="print-page">
            <div style={{background:C.bg2,border:`1px solid ${C.bg5}`,borderRadius:12,padding:"18px 22px",marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
                <div><div style={{fontWeight:800,fontSize:20,color:C.tx}}>Oliver's Supermercado</div><div style={{fontSize:13,color:C.tx2}}>Relatório Financeiro — {dateRange.label}</div><div style={{fontSize:11,color:C.tx3,marginTop:3}}>Período: {dateRange.s} → {dateRange.e} · {new Date().toLocaleString("pt-BR")}</div></div>
                <div style={{textAlign:"right"}}><div style={{fontSize:11,color:C.tx3}}>Dívidas ativas</div><div style={{color:C.red,fontWeight:700,fontSize:20}}>{fmt(totalDebt)}</div><div style={{fontSize:11,color:C.org}}>{fmt(dailyBurn)}/dia em juros</div></div>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:12}}>
              {[[fmt(periodTot.rev),"Receita Bruta",C.grn],[fmt(periodTot.cmvAmt),`CMV (${cmv}%)`,C.org],[fmt(periodTot.gp),"Lucro Bruto",C.blu],[fmt(periodTot.net),"Resultado Líquido",periodTot.net>=0?C.grn:C.red],[fmt(periodTot.fixE),"Desp. Fixas",C.red],[fmt(periodTot.varE),"Desp. Variáveis",C.yel],[fmt(periodTot.finE),"Desp. Financeiras",C.red],[`${periodTot.margin.toFixed(1)}%`,"Margem Líquida",periodTot.margin>=0?C.grn:C.red]].map(([v,l,c])=><div key={l} style={{background:C.bg2,border:`1px solid ${C.bg5}`,borderRadius:10,padding:"11px 13px"}}><div style={{fontSize:11,color:C.tx3,fontWeight:500,marginBottom:5,textTransform:"uppercase",letterSpacing:.3}}>{l}</div><div style={{fontWeight:700,fontSize:18,color:c}}>{v}</div></div>)}
            </div>

            {/* NEW: Vencimentos no Relatório */}
            {upcoming15d.length>0&&<Card title="Próximos Vencimentos — 15 Dias" action={`${upcoming15d.length} itens`} noPad>
              <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead><tr>{["Vencimento","Credor / Conta","Tipo","Valor","Prazo"].map(h=><th key={h} style={{padding:"10px 14px",textAlign:h==="Valor"?"right":"left",borderBottom:`1px solid ${C.bg5}`,color:C.tx3,fontWeight:500,fontSize:11}}>{h}</th>)}</tr></thead>
                <tbody>{upcoming15d.map(u=>{
                  const typeLabels={fixed:"Conta Fixa",vital:"Vital",agiota:"Agiota",fornecedor:"Fornecedor",banco:"Banco",imposto:"Imposto",boleto:"Boleto",agenda:"Agendado"};
                  const typeColors={fixed:C.org,vital:C.red,agiota:C.red,fornecedor:C.yel,banco:C.blu,imposto:C.pur,agenda:C.grn};
                  return<tr key={u.id} style={{borderBottom:`1px solid ${C.bg5}`}}>
                    <td style={{padding:"9px 14px",color:C.tx2}}>{fmtD(u.dueDate)}</td>
                    <td style={{padding:"9px 14px",fontWeight:500}}>{u.label}</td>
                    <td style={{padding:"9px 14px"}}><Badge text={typeLabels[u.type]||u.type} color={typeColors[u.type]||C.tx3}/></td>
                    <td style={{padding:"9px 14px",textAlign:"right",fontWeight:700,color:typeColors[u.type]||C.red}}>{u.isEstimate?"~":""}{fmt(u.amount)}</td>
                    <td style={{padding:"9px 14px"}}><Badge text={u.due<=0?`${Math.abs(u.due)}d atraso`:u.due===0?"Hoje":`${u.due}d`} color={u.due<=0?C.red:u.due<=3?C.org:u.due<=7?C.yel:C.grn}/></td>
                  </tr>;
                })}</tbody>
                <tfoot><tr style={{background:C.bg3,borderTop:`2px solid ${C.bg5}`}}><td colSpan={3} style={{padding:"10px 14px",fontWeight:700}}>Total 15 Dias</td><td style={{padding:"10px 14px",textAlign:"right",fontWeight:700,color:C.red,fontSize:14}}>{fmt(upcoming15d.reduce((s,u)=>s+u.amount,0))}</td><td/></tr></tfoot>
              </table></div>
            </Card>}

            <Card title="DRE por Período" noPad>
              <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:400}}><thead><tr><th style={{textAlign:"left",padding:"10px 18px",borderBottom:`1px solid ${C.bg5}`,color:C.tx3,fontWeight:500}}>Linha</th>{monthlyDRE.map(m=><th key={m.ym} style={{textAlign:"right",padding:"10px 13px",borderBottom:`1px solid ${C.bg5}`,color:C.tx3,fontWeight:500,minWidth:90}}>{m.label}</th>)}<th style={{textAlign:"right",padding:"10px 13px",borderBottom:`1px solid ${C.bg5}`,color:C.org,fontWeight:600,minWidth:100}}>Total</th></tr></thead>
              <tbody>{[{key:"rev",label:"(+) Receita Bruta",bold:false,color:C.grn,neg:false,tot:periodTot.rev},{key:"cmvAmt",label:`(-) CMV`,bold:false,color:C.org,neg:true,tot:-periodTot.cmvAmt},{key:"gp",label:"= Lucro Bruto",bold:true,color:C.blu,neg:false,tot:periodTot.gp},{key:"fixE",label:"(-) Desp. Fixas",bold:false,color:C.red,neg:true,tot:-periodTot.fixE},{key:"varE",label:"(-) Desp. Variáveis",bold:false,color:C.yel,neg:true,tot:-periodTot.varE},{key:"ebitda",label:"= EBITDA",bold:true,color:null,neg:false,tot:periodTot.ebitda},{key:"finE",label:"(-) Desp. Fin.",bold:false,color:C.red,neg:true,tot:-periodTot.finE},{key:"net",label:"= Resultado",bold:true,color:null,neg:false,tot:periodTot.net},{key:"margin",label:"Margem %",bold:false,color:C.tx3,neg:false,pct:true,tot:periodTot.margin}].map(row=><tr key={row.key} style={{borderBottom:`1px solid ${C.bg5}`}}><td style={{padding:"8px 18px",color:row.bold?C.tx:C.tx2,fontWeight:row.bold?600:400,background:row.bold?C.bg3:"transparent"}}>{row.label}</td>{monthlyDRE.map(m=>{const raw=m[row.key]||0,val=row.neg?-raw:raw,c=row.color||(val>=0?C.grn:C.red);return<td key={m.ym} style={{padding:"8px 13px",textAlign:"right",color:c,fontWeight:row.bold?700:400,background:row.bold?C.bg3:"transparent"}}>{row.pct?`${raw.toFixed(1)}%`:fmt(val)}</td>;})}<td style={{padding:"8px 13px",textAlign:"right",fontWeight:700,color:row.pct?C.tx2:((row.tot||0)>=0?C.grn:C.red),borderLeft:`1px solid ${C.bg5}`,background:row.bold?C.bg3:"transparent"}}>{row.pct?`${(row.tot||0).toFixed(1)}%`:fmt(row.tot||0)}</td></tr>)}</tbody></table></div>
            </Card>
            <Card title="Matriz de Dívidas" noPad>
              <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr>{["Credor","Prioridade","Valor","Juros/dia","Custo Diário","Vencimento","Status"].map(h=><th key={h} style={{padding:"10px 14px",textAlign:"left",borderBottom:`1px solid ${C.bg5}`,color:C.tx3,fontWeight:500,fontSize:11}}>{h}</th>)}</tr></thead>
              <tbody>{enrichDebs.map(d=>{const due=daysU(d.dueDate),p=PC[d.priority];return<tr key={d.id} style={{borderBottom:`1px solid ${C.bg5}`}}><td style={{padding:"9px 14px",fontWeight:600}}>{d.creditor}</td><td style={{padding:"9px 14px"}}><Badge text={p.label} color={p.color}/></td><td style={{padding:"9px 14px",color:p.color,fontWeight:700}}>{fmt(d.value)}</td><td style={{padding:"9px 14px",color:C.org}}>{d.dailyInterest}%</td><td style={{padding:"9px 14px",color:C.org}}>{fmt(d.dailyCost)}</td><td style={{padding:"9px 14px",color:due<0?C.red:due<=3?C.org:C.tx2}}>{fmtD(d.dueDate)}{due<0?` (${Math.abs(due)}d)`:due===0?" (Hoje)":""}</td><td style={{padding:"9px 14px"}}><Badge text="Ativa" color={C.red}/></td></tr>;})}
              <tr style={{borderTop:`2px solid ${C.bg5}`,background:C.bg3}}><td colSpan={2} style={{padding:"10px 14px",fontWeight:700}}>Total Ativas</td><td style={{padding:"10px 14px",fontWeight:700,color:C.red,fontSize:14}}>{fmt(totalDebt)}</td><td style={{padding:"10px 14px",color:C.tx3}}>—</td><td style={{padding:"10px 14px",fontWeight:600,color:C.org}}>{fmt(dailyBurn)}/dia</td><td colSpan={2} style={{padding:"10px 14px",color:C.tx3,fontSize:11}}>Queima em juros</td></tr></tbody></table></div>
            </Card>
            <div style={{background:C.bg2,border:`1px solid ${C.bg5}`,borderRadius:12,padding:"13px 18px",fontSize:12,color:C.tx3,lineHeight:1.8}}>
              <strong style={{color:C.tx2}}>Oliver's Supermercado · {new Date().toLocaleString("pt-BR")}</strong><br/>
              Período: {dateRange.s} → {dateRange.e} · CMV: {cmv}% · Dívidas: {enrichDebs.length} · Documento confidencial.
            </div>
          </div>
        </>}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
